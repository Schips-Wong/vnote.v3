name: CI-Linux

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false

env:
    VNOTE_VER: 3.20.1
    CMAKE_VER: 3.24.3

jobs:
  build-linux:
    name: Build On Ubuntu 22.04
    # Build on the oldest still-supported Ubuntu so the produced AppImage keeps
    # working against older glibc (a build on 24.04 raises the floor to 2.39).
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # The release / continuous-build steps below create releases and move tags.
    permissions:
      contents: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Init Submodules
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git submodule sync --recursive
          git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1

      - name: Install a Fresh CMake
        run: |
          wget --no-verbose https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-Linux-x86_64.sh
          chmod +x cmake-${CMAKE_VER}-Linux-x86_64.sh
          mkdir ${{runner.workspace}}/cmake
          sudo ./cmake-${CMAKE_VER}-Linux-x86_64.sh --skip-license --prefix=${{runner.workspace}}/cmake
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack
          sudo ln -s ${{runner.workspace}}/cmake/bin/cmake /usr/local/bin/cmake
          sudo ln -s ${{runner.workspace}}/cmake/bin/cpack /usr/local/bin/cpack

      - name: Install linuxdeploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Install Dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libfcitx5-qt-dev fcitx-libs-dev extra-cmake-modules libxkbcommon-dev
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tree
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fuse libxcb-cursor-dev

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{runner.workspace}}/Qt
          # The Qt tree also holds the OpenSSL compiled on the runner, so the key
          # is tied to the image as well as to the Qt version.
          key: ${{ runner.os }}-ubuntu-22.04-QtCache-6.8.3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.8.3
          target: desktop
          modules: 'qtwebengine qtwebchannel qtpositioning qtpdf qtimageformats qt5compat qtserialport'
          tools: 'tools_opensslv3_src'
          cache: 'true'
          cache-key-prefix: install-qt-action-ubuntu-22.04

      - name: Compile OpenSSLV3
        run: |
          cd ${Qt6_DIR}/../../Tools/OpenSSLv3/src
          ./Configure
          make -j2
          sudo make install

      - name: Create Build Dir
        run: mkdir build
        working-directory: ${{runner.workspace}}

      - name: Compile fcitxqt5
        run: |
          git clone https://github.com/fcitx/fcitx-qt5
          cd fcitx-qt5
          mkdir build && cd build
          cmake -DENABLE_QT5=OFF -DENABLE_QT6=ON ..
          make -j2
          sudo make install
        working-directory: ${{runner.workspace}}/build

      # A "Compile qt6ct" step used to live here. It was removed because the
      # upstream it cloned (trialuser02/qt6ct) is archived and includes
      # <private/qgenericunixthemes_p.h>, a private header whose layout Qt keeps
      # rearranging, so an unpinned clone is a build-breaking dependency. Its
      # output was never bundled either: linuxdeploy-plugin-qt deploys only
      # libqxdgdesktopportal.so out of platformthemes/ unless
      # DEPLOY_PLATFORM_THEMES is set, and src/CPackLinuxDeployQt.cmake.in adds
      # libqgtk3.so explicitly instead.
      # Do not reintroduce it without also arranging deployment. Contrast with
      # "Compile fcitxqt5" above, which must stay: platforminputcontexts IS
      # deployed by linuxdeploy's Qt plugin.

      - name: Configure Project
        run: |
          qmake -v
          cmake --version
          cmake ${GITHUB_WORKSPACE}
        working-directory: ${{runner.workspace}}/build

      - name: Build Project
        run: |
          # Remove the libqsqlmimer.so as libmimerapi.so is not deployed with
          # Qt6. `-f` on purpose: not every Qt build ships that plugin, and a
          # plain `rm` aborts the whole step under `set -e`.
          rm -f ${{runner.workspace}}/Qt/6.*/gcc_64/plugins/sqldrivers/libqsqlmimer.so
          cmake --build . --target pack
        working-directory: ${{runner.workspace}}/build

      - name: Fix Package
        run: |
          set -e
          mkdir fixpackage
          mv VNote*.AppImage ./fixpackage
          pushd fixpackage
          # Extract the AppImage
          ./VNote*.AppImage --appimage-extract
          # Remove libnss3.so and libnssutil3.so
          rm -f ./squashfs-root/usr/lib/libnss*.so
          # Re-package
          rm -f VNote*.AppImage
          linuxdeploy-plugin-appimage-x86_64.AppImage --appdir=./squashfs-root
          mv VNote*.AppImage ../
          popd
          mv VNote*.AppImage VNote-${{env.VNOTE_VER}}-linux-x64.AppImage
        working-directory: ${{runner.workspace}}/build

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VNote-${{env.VNOTE_VER}}-linux-x64.AppImage
          path: ${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-linux-x64.AppImage

      - name: Update Continuous Build Release
        # [Release] pushes are excluded: those publish the stable release below.
        if: >-
          github.ref == 'refs/heads/master' &&
          !startsWith(github.event.head_commit.message, '[Release]')
        shell: bash
        working-directory: ${{runner.workspace}}/build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh runs outside a git checkout here, so its git-based repo detection
          # fails ("fatal: not a git repository"); GH_REPO removes that need.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Idempotent: every job of the run shares GITHUB_SHA.
          gh release create continuous-build \
            --target "$GITHUB_SHA" \
            --title "Continuous Build" \
            --prerelease \
            --notes "Continuous build from master ($GITHUB_SHA)." || true
          # Replaces the old `git tag --force && git push --force --tags`, which
          # needs repo write access that a fork's GITHUB_TOKEN does not have.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/continuous-build" \
            -F sha="$GITHUB_SHA" -F force=true || true

          # Prune only this platform's own asset family.
          for asset in $(gh release view continuous-build \
              --json assets --jq '.assets[].name' \
              | grep -E 'linux-x64\.AppImage$'); do
            gh release delete-asset continuous-build "$asset" -y || true
          done

          gh release upload continuous-build "VNote-${VNOTE_VER}-linux-x64.AppImage" --clobber

      - name: Release
        if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[Release]')
        uses: ncipollo/release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-linux-x64.AppImage
          # Without this an unmatched upload is only a warning, so a release that
          # attached nothing still reports success.
          artifactErrorsFailBuild: true
          commit: master
          tag: v${{env.VNOTE_VER}}
          allowUpdates: true
          # release-action replaces the body and the name on update unless told
          # otherwise, and every platform job targets the same draft, so the
          # last job to run would blank whatever notes were already set.
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: true
