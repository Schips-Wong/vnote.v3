name: CI-MacOS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false

env:
    VNOTE_VER: 3.20.1
    CMAKE_VER: 3.24.3

jobs:
  build:
    environment: Mac-code-sign
    name: ${{ matrix.config.name }}
    timeout-minutes: 120
    # The release / continuous-build steps below create releases and move tags.
    permissions:
      contents: write
    # Exposed at job level so the signing steps can gate themselves on whether
    # the secrets actually exist. A fork without a Developer ID certificate must
    # still be able to build and publish an unsigned DMG instead of failing at
    # `security import` with an empty .p12. (Secrets cannot be referenced in an
    # `if:` directly, but they can be read back through the env context.)
    env:
      CLI_MACOS_CERTIFICATE: ${{ secrets.CLI_MACOS_CERTIFICATE }}
      CLI_MACOS_CERTIFICATE_PWD: ${{ secrets.CLI_MACOS_CERTIFICATE_PWD }}
      CLI_MACOS_CERTIFICATE_NAME: ${{ secrets.CLI_MACOS_CERTIFICATE_NAME }}
      CLI_MACOS_NOTARY_USER: ${{ secrets.CLI_MACOS_NOTARY_USER }}
      CLI_MACOS_TEAM_ID: ${{ secrets.CLI_MACOS_TEAM_ID }}
      CLI_MACOS_NOTARY_PWD: ${{ secrets.CLI_MACOS_NOTARY_PWD }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Build on Arm64 (Qt 6.8.3)"
            os: macos-latest
            arch: universal
            qt: 6.8.3
            # Must stay in sync with CMAKE_OSX_DEPLOYMENT_TARGET in the root
            # CMakeLists.txt and with LSMinimumSystemVersion in Info.plist.
            deployment_target: "12.1"

    runs-on: ${{matrix.config.os}}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Init Submodules
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git submodule sync --recursive
          git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1

      - name: Install Dependencies
        run: |
          brew install tree libiodbc libpq

      - name: Fix SQL
        run: |
          set -e
          # Qt ships qsqlodbc/qsqlpsql plugins that reference these libraries by
          # absolute path. Resolve them from the actual brew prefix: hardcoding
          # the Cellar version (`libpq/16.3/...`) breaks as soon as Homebrew
          # bumps libpq, and the step dies on a dangling symlink.
          IODBC_LIB="$(brew --prefix libiodbc)/lib/libiodbc.2.dylib"
          LIBPQ_LIB="$(brew --prefix libpq)/lib/libpq.5.dylib"
          test -f "$IODBC_LIB" || { echo "missing $IODBC_LIB"; exit 1; }
          test -f "$LIBPQ_LIB" || { echo "missing $LIBPQ_LIB"; exit 1; }
          sudo mkdir -p /usr/local/opt/libiodbc/lib
          sudo ln -sf "$IODBC_LIB" /usr/local/opt/libiodbc/lib/libiodbc.2.dylib
          sudo mkdir -p /Applications/Postgres.app/Contents/Versions/14/lib
          sudo ln -sf "$LIBPQ_LIB" /Applications/Postgres.app/Contents/Versions/14/lib/libpq.5.dylib

      - name: Install a fresh CMake
        run: |
          wget --no-verbose https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-macos-universal.tar.gz
          tar xzf cmake-${CMAKE_VER}-macos-universal.tar.gz
          sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack
          sudo ln -s ${{runner.workspace}}/cmake-${CMAKE_VER}-macos-universal/CMake.app/Contents/bin/cmake /usr/local/bin/cmake
          sudo ln -s ${{runner.workspace}}/cmake-${CMAKE_VER}-macos-universal/CMake.app/Contents/bin/cpack /usr/local/bin/cpack
        working-directory: ${{runner.workspace}}

      - name: Install macdeployqtfix
        run: |
          git clone https://github.com/tamlok/macdeployqtfix.git macdeployqtfix --depth=1
        working-directory: ${{runner.workspace}}

      - name: Install optool
        run: |
          wget --no-verbose https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip
          unzip ./optool.zip
          sudo ln -sf ./optool /usr/local/bin/optool
        working-directory: ${{runner.workspace}}

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{runner.workspace}}/Qt
          key: ${{runner.os}}-${{matrix.config.arch}}-QtCache-${{matrix.config.qt}}

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{matrix.config.qt}}
          target: desktop
          modules: 'qtwebengine qtwebchannel qtpositioning qtpdf qtimageformats qt5compat qtserialport'
          cache: 'true'

      - name: Create Build Dir
        run: mkdir build
        working-directory: ${{runner.workspace}}

      - name: Configure Project
        run: |
          qmake -v
          cmake --version
          # Keep the bundle's declared minimum OS aligned with the deployment
          # target this Qt variant is built for: src/Packaging.cmake copies
          # src/data/core/Info.plist into the bundle as-is and overrides the
          # CMake-generated one, so a stale value there is what ships.
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion ${{matrix.config.deployment_target}}" "${GITHUB_WORKSPACE}/src/data/core/Info.plist"
          cmake -DMACDEPLOYQTFIX_EXECUTABLE=${{runner.workspace}}/macdeployqtfix/macdeployqtfix.py -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=${{matrix.config.deployment_target}} ${GITHUB_WORKSPACE}
        working-directory: ${{runner.workspace}}/build

      - name: Build Project
        run: |
          set -e
          # Keep only required SQL drivers. `-f` because not every Qt build
          # ships all of them, and a plain `rm` aborts the step.
          rm -f ${{env.Qt6_DIR}}/plugins/sqldrivers/libqsqlmimer.dylib
          rm -f ${{env.Qt6_DIR}}/plugins/sqldrivers/libqsqlodbc.dylib
          rm -f ${{env.Qt6_DIR}}/plugins/sqldrivers/libqsqlpsql.dylib

          # Build the project
          cmake --build . --target pack

          test -d ./src/VNote.app || { echo "src/VNote.app not produced"; exit 1; }

          # Fix Qt frameworks
          python3 ${{runner.workspace}}/macdeployqtfix/macdeployqtfix.py ./src/VNote.app/Contents/MacOS/VNote ${{env.Qt6_DIR}}/../..

          # Only delete rpaths that exist to avoid errors
          for rpath in $(otool -l ./src/VNote.app/Contents/MacOS/VNote | awk '/LC_RPATH/ {getline; getline; print $2}' | grep 'vnote'); do
            echo "Checking rpath: $rpath"
            if otool -l ./src/VNote.app/Contents/MacOS/VNote | grep -q "$rpath"; then
              echo "Deleting rpath: $rpath"
              install_name_tool -delete_rpath "$rpath" ./src/VNote.app/Contents/MacOS/VNote
            else
              echo "Rpath not found: $rpath"
            fi
          done
          for rpath in $(otool -l ./src/VNote.app/Contents/Frameworks/libVTextEdit.dylib | awk '/LC_RPATH/ {getline; getline; print $2}' | grep 'vnote'); do
            echo "Checking rpath: $rpath"
            if otool -l ./src/VNote.app/Contents/Frameworks/libVTextEdit.dylib | grep -q "$rpath"; then
              echo "Deleting rpath: $rpath"
              install_name_tool -delete_rpath "$rpath" ./src/VNote.app/Contents/Frameworks/libVTextEdit.dylib
            else
              echo "Rpath not found: $rpath"
            fi
          done

          # Run macdeployqtfix again to ensure all dependencies are properly fixed
          python3 ${{runner.workspace}}/macdeployqtfix/macdeployqtfix.py ./src/VNote.app/Contents/MacOS/VNote ${{env.Qt6_DIR}}/../..
        working-directory: ${{runner.workspace}}/build

      - name: Codesign Bundle
        # Skipped when no signing certificate is configured; the DMG is then
        # produced unsigned rather than failing the whole job.
        if: ${{ env.CLI_MACOS_CERTIFICATE != '' && env.CLI_MACOS_CERTIFICATE_PWD != '' && env.CLI_MACOS_CERTIFICATE_NAME != '' }}
        # Extract the secrets we defined earlier as environment variables
        env:
          MACOS_CERTIFICATE: ${{ secrets.CLI_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.CLI_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.CLI_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.CLI_MACOS_CERTIFICATE }}
        run: |
          set -e
          # Turn our base64-encoded certificate back to a regular .p12 file
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12

          # We need to create a new keychain, otherwise using the certificate will prompt
          # with a UI dialog asking for the certificate password, which we can't
          # use in a headless CI environment
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain

          echo "Codesigning main app bundle"
          codesign --force --deep -s "$MACOS_CERTIFICATE_NAME" --entitlements ${{github.workspace}}/package/entitlements.xml --options runtime ./src/VNote.app
          codesign -v -vvv ./src/VNote.app
        working-directory: ${{runner.workspace}}/build

      - name: Create DMG
        # Separate from signing: the DMG must be produced even when the build is
        # unsigned, otherwise there is no artifact to archive.
        run: |
          set -e
          DMG_NAME="VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}.dmg"

          # Spotlight / XProtect can hold handles on freshly built or freshly
          # codesigned bundle contents, causing `hdiutil create` to fail with
          # "Resource busy". Flush filesystem buffers + wait a beat, then retry
          # with backoff.
          sync
          sleep 5
          for attempt in 1 2 3 4 5; do
            echo "hdiutil create attempt $attempt: $DMG_NAME"
            if hdiutil create -volname "VNote" -srcfolder ./src/VNote.app -ov -format UDZO "$DMG_NAME"; then
              echo "hdiutil create succeeded on attempt $attempt"
              break
            fi
            echo "hdiutil create failed on attempt $attempt; cleaning up and retrying"
            hdiutil detach -force "/Volumes/VNote" 2>/dev/null || true
            if [ "$attempt" = "5" ]; then
              echo "hdiutil create exhausted retries"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          test -f "./$DMG_NAME" || { echo "$DMG_NAME not produced"; exit 1; }
        working-directory: ${{runner.workspace}}/build

      - name: Codesign DMG
        if: ${{ env.CLI_MACOS_CERTIFICATE != '' && env.CLI_MACOS_CERTIFICATE_PWD != '' && env.CLI_MACOS_CERTIFICATE_NAME != '' }}
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.CLI_MACOS_CERTIFICATE_NAME }}
        run: |
          set -e
          DMG_NAME="VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}.dmg"
          codesign --force --deep -s "$MACOS_CERTIFICATE_NAME" --entitlements ${{github.workspace}}/package/entitlements.xml --options runtime "./$DMG_NAME"
          codesign -v -vvv "./$DMG_NAME"
        working-directory: ${{runner.workspace}}/build

      - name: Notarize Bundle
        # Notarization only makes sense for a properly signed DMG.
        if: ${{ env.CLI_MACOS_CERTIFICATE != '' && env.CLI_MACOS_NOTARY_USER != '' && env.CLI_MACOS_TEAM_ID != '' && env.CLI_MACOS_NOTARY_PWD != '' }}
        # Extract the secrets we defined earlier as environment variables
        env:
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.CLI_MACOS_NOTARY_USER }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.CLI_MACOS_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.CLI_MACOS_NOTARY_PWD }}
        run: |
          set -e
          # Store the notarization credentials so that we can prevent a UI password dialog
          # from blocking the CI
          echo "Create keychain profile"
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" --password "$PROD_MACOS_NOTARIZATION_PWD"

          # Here we send the notarization request to the Apple's Notarization service, waiting for the result.
          echo "Notarize app"
          xcrun notarytool submit "${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}.dmg" --keychain-profile "notarytool-profile" --wait

          # Finally, we need to "attach the staple" to our executable, which will allow our app to be
          # validated by macOS even when an internet connection is not available.
          echo "Attach staple"
          xcrun stapler staple "${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}.dmg"

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Archive DMG
        uses: actions/upload-artifact@v4
        with:
          name: VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}
          path: ${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}.dmg

      - name: Update Continuous Build Release
        # [Release] pushes are excluded: those publish the stable release below.
        if: >-
          github.ref == 'refs/heads/master' &&
          !startsWith(github.event.head_commit.message, '[Release]')
        shell: bash
        working-directory: ${{runner.workspace}}/build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh runs outside a git checkout here, so its git-based repo detection
          # fails ("fatal: not a git repository"); GH_REPO removes that need.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Idempotent: every job of the run shares GITHUB_SHA.
          gh release create continuous-build \
            --target "$GITHUB_SHA" \
            --title "Continuous Build" \
            --prerelease \
            --notes "Continuous build from master ($GITHUB_SHA)." || true
          # Replaces the old `git tag --force && git push --force --tags`, which
          # needs repo write access that a fork's GITHUB_TOKEN does not have.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/continuous-build" \
            -F sha="$GITHUB_SHA" -F force=true || true

          # Prune only this platform's own asset family.
          for asset in $(gh release view continuous-build \
              --json assets --jq '.assets[].name' \
              | grep -E 'mac-universal\.dmg$'); do
            gh release delete-asset continuous-build "$asset" -y || true
          done

          gh release upload continuous-build "VNote-${VNOTE_VER}-mac-${{matrix.config.arch}}.dmg" --clobber

      - name: Release
        if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[Release]')
        uses: ncipollo/release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-mac-${{matrix.config.arch}}.dmg
          # Without this an unmatched upload is only a warning, so a release that
          # attached nothing still reports success.
          artifactErrorsFailBuild: true
          commit: master
          tag: v${{env.VNOTE_VER}}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: true
